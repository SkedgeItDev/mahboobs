<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a18" />
    <meta name="description" content="A stacked solitaire matching game. Find two halves, clear the table, and keep your streak alive." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Matching Room" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mah Boobs · The Matching Room</title>
    <script>
      try{if(localStorage.getItem('mah-age-ok')==='true')document.documentElement.classList.add('mah-age-ok')}catch(e){}
    </script>
    <style>
      html,body{margin:0;background:#101a18;min-height:100dvh;overscroll-behavior:none}
      #app-splash{position:fixed;inset:0;z-index:4000;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));color:#fff2d7;text-align:center;isolation:isolate}
      #app-splash .app-splash-panel{position:absolute;top:0;bottom:0;width:50.15%;background:radial-gradient(ellipse at 50% 35%,#235f48,#0d2a27 62%,#0a1b1c)}
      #app-splash .app-splash-left{left:0;border-right:2px solid #b68c5b}
      #app-splash .app-splash-right{right:0;border-left:2px solid #b68c5b}
      #app-splash .app-splash-content{position:relative;z-index:1;width:min(90vw,400px)}
      #app-splash .app-splash-mark{display:block;width:96px;height:96px;margin:0 auto 18px;border-radius:22px}
      #app-splash .app-splash-eyebrow{display:block;margin-bottom:12px;color:#e7c583;font:700 13px/1 Arial,sans-serif;letter-spacing:4px}
      #app-splash .app-splash-title{display:block;margin:0 0 16px;font:italic 600 clamp(36px,10vw,52px)/1.05 Georgia,serif;letter-spacing:-1.5px;text-shadow:0 4px 22px #041b17}
      #app-splash .app-splash-copy{margin:0 0 20px;color:#d5e0d4;font:400 14px/1.55 Arial,sans-serif}
      #app-splash .app-splash-confirm{display:flex;align-items:flex-start;gap:12px;width:min(100%,340px);margin:0 auto 22px;color:#fff2d7;font:500 15px/1.45 Arial,sans-serif;text-align:left}
      #app-splash .app-splash-confirm input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:#dfb974}
      #app-splash .app-splash-enter{display:grid;place-items:center;min-width:min(100%,280px);min-height:54px;margin:0 auto;border:1px solid #f4d79c;border-radius:29px;background:#dfb974;color:#251e18;font:700 17px Arial,sans-serif;opacity:.42}
      #app-splash .app-splash-leave{display:block;margin-top:12px;color:#c9d6c8;font:600 15px/1.4 Arial,sans-serif;text-decoration:underline;text-underline-offset:3px}
      html.mah-age-ok #app-splash{display:none}
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Mah Boobs">
      <div class="app-splash-panel app-splash-left" aria-hidden="true"></div>
      <div class="app-splash-panel app-splash-right" aria-hidden="true"></div>
      <div class="app-splash-content">
        <img class="app-splash-mark" src="/icons/icon-192.png" width="96" height="96" alt="" />
        <span class="app-splash-eyebrow">THE MATCHING ROOM</span>
        <strong class="app-splash-title">Mah Boobs</strong>
        <p class="app-splash-copy">This matching game includes nudity and sexual imagery. Check the box to confirm you are 18 or older, or of legal age where you live, then tap Enter.</p>
        <div class="app-splash-gate">
          <p class="app-splash-confirm"><input type="checkbox" disabled tabindex="-1" aria-hidden="true" />I am 18 or older, or of legal age where I live</p>
          <span class="app-splash-enter">Enter</span>
          <span class="app-splash-leave">I'm under 18 · Leave</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
